name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest -q
      - name: Smoke test the CLI
        run: |
          python -m ghostjobs simulate --out demo-data --days 90
          python -m ghostjobs eval --data demo-data
          python -m ghostjobs report --data demo-data --limit 3
