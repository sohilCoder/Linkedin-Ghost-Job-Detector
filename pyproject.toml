[project]
name = "ghost-job-detector"
version = "0.1.0"
description = "Detect reposted and stale job listings with MinHash/LSH and explainable scoring."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ghostjobs = "ghostjobs.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ghostjobs"]

[tool.setuptools.package-data]
ghostjobs = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
